<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Valentine Azolibe — Full-Stack Developer crafting polished, high-performance web applications. View projects, skills, and get in touch."
    />
    <title>Valentine Azolibe — Full-Stack Developer</title>
    <link rel="canonical" href="https://valentine-azolibe.vercel.app/" />
    <meta name="author" content="Valentine Azolibe" />
    <meta name="theme-color" content="#050508" />

    <!-- Open Graph. Without these a shared link renders as a bare URL with no
         card at all, which is what X, LinkedIn, WhatsApp and Slack all read. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Valentine Azolibe" />
    <meta property="og:url" content="https://valentine-azolibe.vercel.app/" />
    <meta property="og:title" content="Valentine Azolibe — Full-Stack Developer" />
    <meta
      property="og:description"
      content="React and TypeScript on the frontend, Python and Django on the backend. Co-founder of Collan. Client sites in production across Nigeria."
    />
    <!-- Absolute URL: crawlers do not resolve relative paths. JPEG because
         several still will not render WebP. -->
    <meta
      property="og:image"
      content="https://valentine-azolibe.vercel.app/images/og-banner.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://valentine-azolibe.vercel.app/images/og-banner.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Valentine Azolibe, Full-Stack Developer, React and Django"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Vibe_with_val" />
    <meta name="twitter:creator" content="@Vibe_with_val" />
    <meta name="twitter:title" content="Valentine Azolibe — Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="React and TypeScript on the frontend, Python and Django on the backend. Co-founder of Collan. Client sites in production across Nigeria."
    />
    <meta
      name="twitter:image"
      content="https://valentine-azolibe.vercel.app/images/og-banner.jpg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint. Without this the page renders
      // dark for a frame before React reads localStorage, which light-theme
      // users see as a flash.
      window.__bootAt = Date.now();
      (function () {
        try {
          var t = localStorage.getItem('portfolio-theme');
          if (!t) {
            t = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      /* Boot screen. Inlined so it paints on the first frame — the app bundle
         is ~390KB and #root is empty until it parses, which on a slow
         connection is several seconds of blank page. Removed once React
         mounts (see main.jsx). */
      /* Themed through custom properties rather than `[data-theme] #boot-*`
         descendant rules: the properties inherit from :root, so every part of
         the boot screen re-resolves together whenever the theme attribute
         changes, with no reliance on descendant-selector invalidation. */
      :root {
        --boot-bg: #050508;
        --boot-fg: #ededed;
        --boot-track: #1e1e2a;
        --boot-hull: #8b5cf6;
        --boot-trail: #06b6d4;
      }
      :root[data-theme='light'] {
        --boot-bg: #f8f9fc;
        --boot-fg: #1a1b2e;
        --boot-track: #dfe1ea;
        --boot-hull: #7c3aed;
        --boot-trail: #0891b2;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 60;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: var(--boot-bg);
        font-family: Epilogue, Outfit, ui-sans-serif, system-ui, sans-serif;
        transition: opacity 0.35s ease;
      }
      #boot .stack {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.25rem;
      }
      #boot .word {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        font-weight: 700;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
        color: var(--boot-fg);
      }
      #boot .word i {
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 9999px;
        background: var(--boot-hull);
        margin-left: 0.1rem;
      }
      /* The rocket is absolutely placed against this box rather than the
         viewport, so the wordmark can own the space above it. */
      #boot .ship {
        position: relative;
        width: 260px;
        height: 56px;
      }
      #boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .speeder {
        position: absolute;
        top: 50%;
        left: 50%;
        margin-left: -65px; /* the hull sits right of its own origin; this centres its visible mass under the wordmark */
        animation: boot-speeder 0.4s linear infinite;
      }
      #boot .longfazers { z-index: 1; }
      #boot .speeder > span {
        height: 5px;
        width: 35px;
        background: var(--boot-hull);
        position: absolute;
        top: -19px;
        left: 60px;
        border-radius: 2px 10px 1px 0;
      }
      #boot .base span {
        position: absolute;
        width: 0;
        height: 0;
        border-top: 6px solid transparent;
        border-right: 100px solid var(--boot-hull);
        border-bottom: 6px solid transparent;
      }
      #boot .base span::before {
        content: "";
        height: 22px;
        width: 22px;
        border-radius: 50%;
        background: var(--boot-hull);
        position: absolute;
        right: -110px;
        top: -16px;
      }
      #boot .base span::after {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        border-top: 0 solid transparent;
        border-right: 55px solid var(--boot-hull);
        border-bottom: 16px solid transparent;
        top: -16px;
        right: -98px;
      }
      #boot .face {
        position: absolute;
        height: 12px;
        width: 20px;
        background: var(--boot-hull);
        border-radius: 20px 20px 0 0;
        transform: rotate(-40deg);
        right: -125px;
        top: -15px;
      }
      #boot .face::after {
        content: "";
        height: 12px;
        width: 12px;
        background: var(--boot-hull);
        right: 4px;
        top: 7px;
        position: absolute;
        transform: rotate(40deg);
        transform-origin: 50% 50%;
        border-radius: 0 0 0 2px;
      }
      #boot .speeder > span > span {
        width: 30px;
        height: 1px;
        background: var(--boot-trail);
        position: absolute;
        animation: boot-fazer1 0.2s linear infinite;
      }
      #boot .speeder > span > span:nth-child(2) { top: 3px; animation: boot-fazer2 0.4s linear infinite; }
      #boot .speeder > span > span:nth-child(3) { top: 1px; animation: boot-fazer3 0.4s linear infinite; animation-delay: -1s; }
      #boot .speeder > span > span:nth-child(4) { top: 4px; animation: boot-fazer4 1s linear infinite; animation-delay: -1s; }
      #boot .longfazers { position: absolute; inset: 0; pointer-events: none; }
      #boot .longfazers span {
        position: absolute;
        height: 2px;
        width: 20%;
        background: var(--boot-trail);
        opacity: 0.35;
      }
      #boot .longfazers span:nth-child(1) { top: 20%; animation: boot-lf 0.6s linear infinite; animation-delay: -5s; }
      #boot .longfazers span:nth-child(2) { top: 40%; animation: boot-lf2 0.8s linear infinite; animation-delay: -1s; }
      #boot .longfazers span:nth-child(3) { top: 60%; animation: boot-lf3 0.6s linear infinite; }
      #boot .longfazers span:nth-child(4) { top: 80%; animation: boot-lf4 0.5s linear infinite; animation-delay: -3s; }
      @keyframes boot-fazer1 { 0% { left: 0; } 100% { left: -80px; opacity: 0; } }
      @keyframes boot-fazer2 { 0% { left: 0; } 100% { left: -100px; opacity: 0; } }
      @keyframes boot-fazer3 { 0% { left: 0; } 100% { left: -50px; opacity: 0; } }
      @keyframes boot-fazer4 { 0% { left: 0; } 100% { left: -150px; opacity: 0; } }
      @keyframes boot-lf  { 0% { left: 200%; } 100% { left: -200%; opacity: 0; } }
      @keyframes boot-lf2 { 0% { left: 200%; } 100% { left: -200%; opacity: 0; } }
      @keyframes boot-lf3 { 0% { left: 200%; } 100% { left: -100%; opacity: 0; } }
      @keyframes boot-lf4 { 0% { left: 200%; } 100% { left: -100%; opacity: 0; } }
      @keyframes boot-speeder {
        0%   { transform: translate(2px, 1px) rotate(0deg); }
        10%  { transform: translate(-1px, -3px) rotate(-1deg); }
        20%  { transform: translate(-2px, 0px) rotate(1deg); }
        30%  { transform: translate(1px, 2px) rotate(0deg); }
        40%  { transform: translate(1px, -1px) rotate(1deg); }
        50%  { transform: translate(-1px, 3px) rotate(-1deg); }
        60%  { transform: translate(-1px, 1px) rotate(0deg); }
        70%  { transform: translate(3px, 1px) rotate(-1deg); }
        80%  { transform: translate(-2px, -1px) rotate(1deg); }
        90%  { transform: translate(2px, 1px) rotate(0deg); }
        100% { transform: translate(1px, -2px) rotate(-1deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .speeder,
        #boot .speeder > span > span { animation: none; }
        #boot .longfazers { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="longfazers" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="stack">
        <div class="word" aria-hidden="true">
          <span>Valentine</span><span>Codes</span><i></i>
        </div>
        <div class="ship" aria-hidden="true">
          <div class="speeder">
            <span><span></span><span></span><span></span><span></span></span>
            <div class="base"><span></span><div class="face"></div></div>
          </div>
        </div>
      </div>
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading portfolio</span>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
